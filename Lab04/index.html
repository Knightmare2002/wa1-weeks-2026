<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Film Library</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <link href="style.css" rel="stylesheet">
</head>
<body class="min-vh-100 d-flex flex-column">
    
    <header class="py-3 border-bottom bg-primary">
        <div class="container-fluid align-items-center">
            <div class="row">
                
                <div class="col-4">
                    <a href="/" class="d-flex align-items-center link-light text-decoration-none">
                        <i class="bi bi-collection-play me-2"></i>
                        <h2>Film Library</h2>
                    </a>
                </div>

                <div class="col-8 d-flex align-items-center justify-content-end">
                    <form class="w-100 me-3">
                        <input type="search" class="form-control" placeholder="Search...">
                    </form>

                    <a href="#" class="link-light text-decoration-none">
                        <i class="bi bi-person-circle fs-4"></i>
                    </a>
                </div>

            </div>
        </div>
    </header>

    <main class="container-fluid flex-grow-1 d-flex flex-column">
        <div class="row flex-grow-1">
            <div id="films-filters" class="col-md-4 bg-light">
                <div class="py-4">
                    <h5 class="mb-3">Filters</h5>
                    
                    <ul class="nav nav-pills flex-column gap-2 mb-auto">
                        <li class="nav-item">
                            <a class="nav-link active" href="#">All</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link link-dark" href="#">Favorites</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link link-dark" href="#">Best rated</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link link-dark" href="#">Seen last month</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link link-dark" href="#">Unseen</a>
                        </li>
                    </ul>
                </div>
            </div>

            <div class="col-md-8">
                <h1>
                    <span id="filter-title">All</span>
                    Films
                </h1>
                <ul class="list-group list-group-flush">
                    <!--Primo riga della lista-->
                    <li class="list-group-item">
                        <div class="row">
                            <div class="col-md-4">
                                FILM
                            </div>
                            <div class="col-md-4 text-center">
                                DATE
                            </div>
                        </div>
                    </li>
                    <!---->
                    <li class="list-group-item">
                        <div class="row">
                            <div class="col-md-4">
                                <i class="bi bi-heart-fill px-2"></i>Pulp Fiction
                            </div>
                            <div class="col-md-4 text-center">
                                March 10, 2026
                            </div>
                            <div class="col-md-4 text-center">
                                <div class="btn-group" role="group" aria-label="Basic mixed styles example">
                                    <div class="px-4">
                                        <i class="bi bi-star-fill"></i>
                                        <i class="bi bi-star-fill"></i>
                                        <i class="bi bi-star-fill"></i>
                                        <i class="bi bi-star"></i>
                                    </div>
                                    <button type="button" class="btn btn-danger"><i class="bi bi-trash-fill"></i></button>
                                    <button type="button" class="btn btn-warning"><i class="bi bi-pencil-fill"></i></button>
                                </div>
                            </div>
                        </div>
                    </li>
                </ul>
            </div>
        </div>
        <button type="button" class="btn btn-primary rounded-circle fixed-right-bottom shadow">
            <i class="bi bi-plus fs-3"></i>
        </button>
    </main>

</body>
</html>
